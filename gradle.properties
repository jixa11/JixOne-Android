# JixOne build — hard 4GB cgroup on the dev box; raise for beefier machines
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1152m
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.unsafe.configuration-cache=false
# ksp.useKSP2 left at default (KSP2-only)
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
